---
- name: Populate Active Directory with BadBlood
  hosts: ad_server
  vars:
    domain_name: "{{ domain_name | default('soclab.local') }}"
    badblood_marker: 'C:\BadBlood_Run.log'
  tasks:
    - name: Download the BadBlood archive on the controller
      delegate_to: localhost
      become: false
      ansible.builtin.get_url:
        url: "https://github.com/davidprowe/BadBlood/archive/refs/heads/master.zip"
        dest: /tmp/BadBlood.zip
        mode: "0644"

    - name: Copy the archive to the Windows Server
      ansible.windows.win_copy:
        src: /tmp/BadBlood.zip
        dest: 'C:\BadBlood.zip'

    - name: Extract and rename the BadBlood folder
      ansible.windows.win_shell: |
        if (!(Test-Path C:\BadBlood)) {
            Expand-Archive -Path C:\BadBlood.zip -DestinationPath C:\ -Force
            $extracted = Get-Item C:\BadBlood-*
            Rename-Item -Path $extracted.FullName -NewName BadBlood
        }
      args:
        creates: C:\BadBlood

    - name: Strip interactive prompts from the BadBlood sources
      ansible.windows.win_shell: |
        Get-ChildItem -Path C:\BadBlood\* -Include *.ps1, *.psm1 -Recurse | ForEach-Object {
            $file = $_.FullName
            (Get-Content $file) | ForEach-Object {
                $_ -replace '(?i)\$host\.ui\.rawui\.readkey\(.*?\)', '$null' `
                   -replace '(?i)Read-Host.*', '"BadBlood"' `
                   -replace '(?i)cmd\.exe /c pause', 'Write-Output "CMD pause skipped"' `
                   -replace '(?i)\bpause\b', 'Write-Output "Pause skipped"'
            } | Set-Content -Path $file
        }

    - name: Run BadBlood (writes the marker file when finished)
      ansible.windows.win_shell: |
        Start-Transcript -Path {{ badblood_marker }} -Force
        cd C:\BadBlood
        $ConfirmPreference   = 'None'
        $ProgressPreference  = 'SilentlyContinue'
        $WarningPreference   = 'SilentlyContinue'
        .\Invoke-BadBlood.ps1
        Stop-Transcript
      args:
        creates: "{{ badblood_marker }}"
      async: 3600
      poll: 30
