---
- name: Install and configure Sysmon (SwiftOnSecurity config)
  hosts: domain_hosts
  vars:
    sysmon_url: "https://download.sysinternals.com/files/Sysmon.zip"
    sysmon_config_url: "https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml"
    sysmon_dir: 'C:\Tools\Sysmon'
  tasks:
    - name: Download Sysmon and its configuration on the controller
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - { url: "{{ sysmon_url }}",        dest: /tmp/Sysmon.zip }
        - { url: "{{ sysmon_config_url }}", dest: /tmp/sysmonconfig.xml }

    - name: Ensure the Sysmon working directory exists
      ansible.windows.win_file:
        path: "{{ sysmon_dir }}"
        state: directory

    - name: Copy the Sysmon archive and configuration to the host
      ansible.windows.win_copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: /tmp/Sysmon.zip,        dest: 'C:\Tools\Sysmon\Sysmon.zip' }
        - { src: /tmp/sysmonconfig.xml,  dest: 'C:\Tools\Sysmon\sysmonconfig.xml' }

    - name: Extract the Sysmon archive
      community.windows.win_unzip:
        src: '{{ sysmon_dir }}\Sysmon.zip'
        dest: "{{ sysmon_dir }}"
        remote_src: true
        creates: '{{ sysmon_dir }}\Sysmon64.exe'

    - name: Query the Sysmon service state
      ansible.windows.win_service_info:
        name: sysmon64
      register: sysmon_service

    - name: Install / re-apply the Sysmon configuration
      ansible.windows.win_shell: >-
        {{ sysmon_dir }}\Sysmon64.exe
        {{ '-accepteula -i' if not sysmon_service.exists else '-c' }}
        {{ sysmon_dir }}\sysmonconfig.xml
      register: sysmon_apply
      changed_when: not sysmon_service.exists

    - name: Ensure the Sysmon service is running
      ansible.windows.win_service:
        name: sysmon64
        state: started
        start_mode: auto
