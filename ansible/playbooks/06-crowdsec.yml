---
- name: Install and configure CrowdSec on Windows hosts
  hosts: domain_hosts
  vars:
    crowdsec_dir: 'C:\Program Files\CrowdSec'
    crowdsec_msi: 'C:\Tools\crowdsec.msi'
  tasks:
    - name: Ensure C:\Tools exists
      ansible.windows.win_file:
        path: C:\Tools
        state: directory

    - name: Download the latest CrowdSec MSI
      ansible.windows.win_shell: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $ProgressPreference = 'SilentlyContinue'
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/crowdsecurity/crowdsec/releases/latest" -UseBasicParsing
        $msi = $release.assets | Where-Object { $_.name -match '\.msi$' } | Select-Object -First 1
        if (-not $msi) { throw "CrowdSec MSI not found in the latest release." }
        Invoke-WebRequest -Uri $msi.browser_download_url -OutFile "{{ crowdsec_msi }}" -UseBasicParsing
      args:
        creates: "{{ crowdsec_msi }}"

    - name: Install CrowdSec silently
      ansible.windows.win_package:
        path: "{{ crowdsec_msi }}"
        arguments: /quiet /norestart
        state: present
      async: 600
      poll: 15

    - name: Update the CrowdSec hub index
      ansible.windows.win_shell: .\cscli.exe hub update
      args:
        chdir: "{{ crowdsec_dir }}"
      changed_when: false

    - name: Install the crowdsecurity/windows-firewall collection
      ansible.windows.win_shell: .\cscli.exe collections install crowdsecurity/windows-firewall
      args:
        chdir: "{{ crowdsec_dir }}"
      changed_when: false

    - name: Configure the Windows Event Log acquisition
      ansible.windows.win_copy:
        dest: 'C:\ProgramData\CrowdSec\config\acquis.yaml'
        content: |
          source: wineventlog
          event_channel: Security
          event_level: Information
          event_ids:
            - 4624
            - 4625
          labels:
            type: windows
          ---
          source: wineventlog
          event_channel: Microsoft-Windows-Windows Firewall With Advanced Security/Firewall
          event_level: Information
          labels:
            type: windows_firewall
      notify: Restart CrowdSec

    - name: Ensure the CrowdSec service is running
      ansible.windows.win_service:
        name: crowdsec
        state: started
        start_mode: auto

  handlers:
    - name: Restart CrowdSec
      ansible.windows.win_service:
        name: crowdsec
        state: restarted
